services:
  - type: web
    name: jeemocks-api
    runtime: node
    repo: https://github.com/darkpanther5667/antigravity-excited-pasteur
    buildCommand: cd backend && npm install && npx prisma generate --schema=../database/schema.prisma
    startCommand: bash start.sh
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: BCRYPT_SALT_ROUNDS
        value: 12
